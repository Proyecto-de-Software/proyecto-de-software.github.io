<h1 id="%C2%BFqu%C3%A9-abordaremos-en-esta-clase">¿Qué abordaremos en esta clase?</h1>
<ul>
<li>Lineamientos básicos a tener en cuenta.</li>
<li>Conceptos básicos de la arquitectura web.</li>
<li>HTML5, CSS3, DOM y Responsive Design.</li>
<li>Ética informática
<ul>
<li>Accesibilidad Web.</li>
<li>Gestión de datos personales.</li>
<li>Uso de la IA.</li>
</ul>
</li>
<li>Primeras actividades de teoría.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="lineamientos-b%C3%A1sicos---1">Lineamientos básicos - 1 -</h1>
<p><strong>Usaremos y desarrollaremos con software libre.</strong></p>
<blockquote>
<p>El <strong>software libre</strong> es el software donde los usuarios tienen la <strong>libertad</strong> para ejecutar, copiar, distribuir, estudiar, modificar y mejorar el software.</p>
</blockquote>
<p><strong>El acceso al código fuente es una condición necesaria.</strong></p>
<p>La definición oficial pueden encontrarla en el <a href="https://www.gnu.org/philosophy/free-sw.html" title="sitio del proyecto GNU">sitio del proyecto GNU</a>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="lineamientos-b%C3%A1sicos---2">Lineamientos básicos - 2 -</h1>
<p><strong>Utilizaremos Git y GitLab para el desarrollo.</strong></p>
<blockquote>
<p><strong>Git</strong> es un <strong>sistema de control de versiones</strong> distribuido libre diseñado para manejar proyectos con velocidad y eficiencia.</p>
</blockquote>
<blockquote>
<p><strong>GitLab</strong> es una plataforma basada en la web que provee un repositorio de código fuente de Git con características de control de versiones y gestión de proyectos.</p>
</blockquote>
<p>Este tema se explicará en detalle la clase siguiente.</p>
<p>Es requisito en nuestra cursada el <strong>trabajo en grupo</strong>. El uso de Git es una ENORME ventaja para la colaboración.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="objetivo-general-de-la-materia">Objetivo general de la materia</h1>
<blockquote>
<p><strong>Desarrollar una aplicación web</strong> integrando distintas herramientas y tecnologías.</p>
</blockquote>
<p>Programaremos en  <strong>Python</strong> y <strong>JavaScript</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-theme="default" lang="es-AR" style="--theme:default;">

<p>Fuente y rutas de aprendizaje actualizadas: <a href="https://roadmap.sh">https://roadmap.sh</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-theme="default" lang="es-AR" style="--theme:default;">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="la-arquitectura-web-b%C3%A1sica">La arquitectura web básica</h1>
<center><img src="images/arquitectura_web_xGemini.png" alt="Arquitectura web básica" width="990px" /></center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="especificaciones-p%C3%BAblicas">Especificaciones públicas</h1>
<h2 id="internet-engineering-task-force-ietf">Internet Engineering Task Force (IETF)</h2>
<center><img src="images/rfc.png" alt="RFC" width="550px" /></center>
<p>RFC: <a href="https://www.ietf.org/process/rfcs/" title="RFC">Request For Comments</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="el-protocolo-http">El Protocolo HTTP</h1>
<blockquote>
<p>&quot;HTTP es un protocolo sin estado (stateless).&quot;</p>
</blockquote>
<p>¿Qué implica esto para el diseño de aplicaciones web?</p>
<ul>
<li><strong>Solicitudes</strong>: GET, POST, PUT, DELETE.</li>
<li><strong>Respuestas</strong>: códigos de estado (200, 404, 500).</li>
</ul>
<p><strong>Evolución</strong>: de HTTP/1.1 a HTTP/3 (QUIC).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="w3c-y-whatwg-est%C3%A1ndares-de-la-web">W3C y WHATWG: estándares de la web</h1>
<blockquote>
<p>El <strong>W3C</strong> (<a href="https://www.w3.org/">World Wide Web Consortium</a>) y el <strong>WHATWG</strong> (<a href="https://html.spec.whatwg.org/multipage/">Web Hypertext Application Technology Working Group</a>) se encargan del desarrollo de <strong>estándares, especificaciones y guías</strong> que aseguren la evolución e interoperabilidad de la web.</p>
</blockquote>
<ul>
<li><strong>WHATWG</strong>: mantiene el &quot;HTML Living Standard&quot; (estándar continuo de HTML).</li>
<li><strong>W3C</strong>: enfocado en recomendaciones, accesibilidad (WAI/WCAG), CSS y arquitectura general de la web.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="est%C3%A1ndares-web-b%C3%A1sicos">Estándares web básicos</h1>
<ul>
<li><strong>HTML5</strong>: estructura y semántica.</li>
<li><strong>CSS3</strong>: presentación y estilo (diseño responsivo).</li>
<li><strong>DOM (Document Object Model)</strong>: la API que conecta HTML con JavaScript.</li>
</ul>
<p>Para explorar el impacto de los estilos en la estructura HTML: <a href="http://www.csszengarden.com/">CSS Zen Garden</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="html5-estructura-sem%C3%A1ntica">HTML5: estructura semántica</h1>
<p>El uso de etiquetas semánticas es vital para SEO (Search Engine Optimization) y <strong>accesibilidad</strong>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">header</span>&gt;</span> ... <span class="hljs-tag">&lt;/<span class="hljs-name">header</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">nav</span>&gt;</span> ... <span class="hljs-tag">&lt;/<span class="hljs-name">nav</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">main</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">article</span>&gt;</span> ... <span class="hljs-tag">&lt;/<span class="hljs-name">article</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">main</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">footer</span>&gt;</span> ... <span class="hljs-tag">&lt;/<span class="hljs-name">footer</span>&gt;</span>
</code></pre>
<p><strong>IMPORTANTE:</strong> <em>no usar <code>&lt;div&gt;</code> para todo.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="dise%C3%B1o-responsivo">Diseño responsivo</h1>
<center><img src="images/viewport.png" alt="Diseño Responsivo" width="800px" /></center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-fragments="1" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="css-estilos-y-dise%C3%B1o-responsivo">CSS: estilos y diseño responsivo</h1>
<ul>
<li><strong>Modelo de caja.</strong></li>
<li><strong>Media Queries</strong> y <strong>viewport</strong>: adaptabilidad real.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-keyword">@media</span> (<span class="hljs-attribute">min-width</span>: <span class="hljs-number">768px</span>) {
    <span class="hljs-comment">/* Estilos para ... */</span>
}
</code></pre>
<ul>
<li data-marpit-fragment="1"><strong>Frameworks vs. Nativo</strong>: aprender CSS nativo es la base para entender cualquier framework (Bootstrap, Tailwind).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="css-%C2%BFd%C3%B3nde-se-ubican-las-reglas">CSS: ¿dónde se ubican las reglas?</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html">	<span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>
	<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;es&quot;</span>&gt;</span>

	<span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
		<span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>Formularios web<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>
		<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;stylesheet&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;estilo.css&quot;</span>&gt;</span>
		<span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">
		     <span class="hljs-selector-tag">h1</span> {<span class="hljs-attribute">color</span>:red}
		</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span>
	<span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
	<span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
	    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span> <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;color:red&quot;</span>&gt;</span> Mi color favorito<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
	<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
	<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="css-cascada-especificidad-y-herencia">CSS: cascada, especificidad y herencia</h1>
<p>El navegador aplica los estilos según un orden de prioridad basado en:</p>
<ol>
<li><strong>Origen y declaración</strong>: <code>!important</code>, estilos de usuario, del autor, del navegador.</li>
<li><strong>Especificidad del selector:</strong> estilo en línea &gt; ID &gt; Clase/Atributo &gt; Etiqueta.</li>
<li><strong>Orden de aparición en el código:</strong> la regla posterior sobrescribe a la anterior.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="dom-document-object-model">DOM: Document Object Model</h1>
<blockquote>
<p>El <a href="https://dom.spec.whatwg.org/">Document Object Model (DOM)</a> es una <strong>API orientada a objetos</strong> que representa la estructura de un documento HTML/XML como un árbol de nodos.</p>
</blockquote>
<table>
<thead>

<center><img src="images/dev_tools.png" alt="Dev tools" width="900px" /></center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-fragments="2" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="%C3%A9tica-inform%C3%A1tica-en-el-desarrollo-de-software">Ética Informática en el desarrollo de software</h1>
<blockquote>
<p><strong>¿Qué es la Ética Informática?</strong><br />
Es la disciplina que analiza los problemas éticos, sociales y legales creados o transformados por la tecnología informática.<br />
–Terrel Bynum</p>
</blockquote>
<ul>
<li data-marpit-fragment="1">Como desarrolladores, nuestras decisiones impactan directamente en las personas, la privacidad y la sociedad.</li>
<li data-marpit-fragment="2">No basta con que el código funcione debe ser <strong>justo, transparente, seguro y accesible</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="comencemos-analizando-c%C3%B3mo-interactuamos">Comencemos analizando cómo interactuamos</h1>
<p>¿Qué sucede cuando accedemos a la web mediante lectores de pantalla o únicamente utilizamos el teclado?</p>
<p><strong>TAREA PARA EL HOGAR:</strong> probar navegar algún sitio web utilizando exclusivamente las teclas <code>Tab</code>, <code>Shift+Tab</code> y <code>Enter</code>.</p>
<p>¿Qué creen que sucederá?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="algunos-videos">Algunos videos</h1>
<p><strong>TAREA PARA EL HOGAR:</strong> veamos el siguiente <a href="https://www.youtube.com/watch?v=20SHvU2PKsM&amp;t=10s">video introductorio a aspectos de accesibilidad web</a></p>
<h2 id="perspectivas">Perspectivas</h2>
<p><a href="https://www.w3.org/WAI/perspective-videos/"><img src="images/video_wai.png" alt="Perspectivas" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="datos-y-contexto-general">Datos y contexto general</h1>
<ul>
<li>
<p><strong>Organización Mundial de la Salud (OMS):</strong></p>
<ul>
<li>Más de <strong>1300 millones de personas</strong> (aproximadamente 1 de cada 6 a nivel mundial) viven con alguna discapacidad significativa.</li>
<li>Al menos <strong>2200 millones de personas</strong> tienen deficiencia visual cercana o lejana.</li>
</ul>
</li>
<li>
<p><strong>Importancia de la inclusión digital:</strong></p>
<ul>
<li>La accesibilidad no solo beneficia a personas con discapacidad permanente, sino también a situaciones temporales (lesión en una mano) o contextuales (pantallas expuestas a luz solar, ambientes ruidosos, baja conectividad).</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="accesibilidad-web">Accesibilidad Web</h1>
<blockquote>
<p><strong>&quot;The power of the Web is in its universality. Access by everyone regardless of disability is an essential aspect.&quot;</strong></p>
<p>— Tim Berners-Lee, creador de la Web.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="%C2%BFqu%C3%A9-involucra-dise%C3%B1ar-pensando-en-accesibilidad">¿Qué involucra diseñar pensando en accesibilidad?</h1>
<ul>
<li>Garantizar la legibilidad y estructura lógica del contenido.</li>
<li>Proporcionar navegación alternativa completa por teclado.</li>
<li>Asegurar contrastes de color adecuados entre texto y fondo.</li>
<li>Proveer equivalentes textuales para contenido no textual (imágenes, audios, videos).</li>
<li>Garantizar la compatibilidad con tecnologías de asistencia (lectores de pantalla como NVDA, JAWS, VoiceOver).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="wai-web-accessibility-initiative">WAI: Web Accessibility Initiative</h1>
<h2 id="objetivos-del-w3c--wai">Objetivos del W3C / WAI</h2>
<blockquote>
<p>Desarrollar estrategias, pautas y recursos para hacer la Web accesible a <strong>todas las personas</strong>, independientemente de sus capacidades físicas, sensoriales o cognitivas, y de los dispositivos o entornos de acceso empleados.</p>
</blockquote>
<p>URL oficial: <a href="https://www.w3.org/WAI/">https://www.w3.org/WAI/</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="componentes-de-accesibilidad-wai">Componentes de Accesibilidad WAI</h1>
<p><img src="images/wai.png" alt="Componentes WAI" /></p>
<p>Fuente: <a href="https://www.w3.org/WAI/standards-guidelines/es#intro">W3C WAI Guidelines</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="principios-de-dise%C3%B1o-pour-wcag-22">Principios de diseño POUR (WCAG 2.2)</h1>
<center><img src="images/principios_pour_gemini.png" alt="Componentes WAI" width="990px" /></center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="wai-aria-accesibilidad-en-interfaces-din%C3%A1micas">WAI-ARIA: accesibilidad en interfaces dinámicas</h1>
<blockquote>
<p><strong>ARIA</strong> (<em>Accessible Rich Internet Applications</em>) es un conjunto de atributos para transmitir información semántica a tecnologías asistivas cuando HTML nativo no alcanza.</p>
</blockquote>
<ul>
<li><strong>Atributos clave</strong>:
<ul>
<li><strong>Roles</strong>: definen qué es un elemento (<code>role=&quot;dialog&quot;</code>, <code>role=&quot;tab&quot;</code>).</li>
<li><strong>Propiedades</strong>: características adicionales (<code>aria-haspopup=&quot;true&quot;</code>).</li>
<li><strong>Estados</strong>: situaciones dinámicas del elemento (<code>aria-expanded=&quot;false&quot;</code>, <code>aria-hidden=&quot;true&quot;</code>).</li>
</ul>
</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>IMPORTANTE:</strong> <em>no usar ARIA si se puede usar un elemento HTML5 nativo que ya posea la semántica y el comportamiento requeridos.</em> (p. ej., usar <code>&lt;button&gt;</code> en lugar de <code>&lt;div role=&quot;button&quot;&gt;</code>).</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="marco-legal-y-normativo">Marco Legal y Normativo</h1>
<blockquote>
<p>En diversos países existen regulaciones que exigen el cumplimiento de niveles de accesibilidad web (habitualmente WCAG 2.1/2.2 nivel AA) para sitios públicos y privados.<br />
<strong>En Argentina:</strong> <a href="http://servicios.infoleg.gob.ar/infolegInternet/anexos/175000-179999/175694/norma.htm">Ley N° 26.653</a></p>
</blockquote>
<p>Más detalles institucionales: <a href="https://www.argentina.gob.ar/jefatura/innovacion-publica/onti/accesibilidad-web">Oficina Nacional de Tecnologías de Información (ONTI)</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="%C2%BFc%C3%B3mo-evaluamos-accesibilidad">¿Cómo evaluamos accesibilidad?</h1>
<ol>
<li><strong>Chequeo rápido</strong>: navegar solo con teclado (<code>Tab</code>).</li>
<li><strong>Herramientas</strong>:
<ul>
<li>Listado de la W3C WAI: <a href="https://www.w3.org/WAI/ER/tools/">https://www.w3.org/WAI/ER/tools/</a></li>
</ul>
</li>
<li><strong>Prueba final</strong>: usuarios reales (siempre la mejor prueba).</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="1-revisiones-iniciales-y-r%C3%A1pidas">1. Revisiones iniciales y rápidas</h1>
<p>Chequeo preliminar recomendado por la W3C:</p>
<ul>
<li>Navegación exclusiva por teclado (<code>Tab</code>, <code>Shift+Tab</code>, <code>Space</code>, <code>Enter</code>).</li>
<li>Verificación visual de contraste de colores.</li>
<li>Zoom del navegador al 200% para verificar la adaptabilidad sin desbordamientos.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="2-herramientas">2. Herramientas</h1>
<ul>
<li>Validación técnica de código:
<ul>
<li><strong>Validador HTML de W3C</strong>: <a href="http://validator.w3.org/">http://validator.w3.org/</a></li>
<li><strong>Validador de CSS de W3C</strong>: <a href="http://jigsaw.w3.org/css-validator/">http://jigsaw.w3.org/css-validator/</a></li>
</ul>
</li>
<li>Herramientas automatizadas de accesibilidad
<ul>
<li><strong>WAVE (Web Accessibility Evaluation Tool)</strong>: <a href="https://wave.webaim.org/">https://wave.webaim.org/</a></li>
<li><strong>Lighthouse (Google Chrome DevTools)</strong>: Auditoría integrada de accesibilidad, rendimiento y SEO.</li>
<li><strong>Listado completo de herramientas W3C WAI</strong>: <a href="https://www.w3.org/WAI/ER/tools/">https://www.w3.org/WAI/ER/tools/</a></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="3-evaluaci%C3%B3n-manual-e-integraci%C3%B3n-con-usuarios-finales">3. Evaluación manual e integración con usuarios finales</h1>
<ul>
<li>Prueba con lectores de pantalla reales (<strong>NVDA</strong>, <strong>JAWS</strong>, <strong>VoiceOver</strong>).</li>
<li>Verificación del orden de foco en componentes complejos (modales, desplegables).</li>
<li>Pruebas directas de usabilidad con personas con discapacidad para evaluar la experiencia real de usuario.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-fragments="4" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="%C3%A9tica-inform%C3%A1tica-el-manejo-de-los-datos">Ética Informática: el manejo de los datos</h1>
<blockquote>
<p><strong>Privacidad por Diseño (Privacy by Design)</strong>: la protección de datos debe ser la configuración por defecto, no una opción secundaria.</p>
</blockquote>
<ul>
<li data-marpit-fragment="1"><strong>Minimización de Datos</strong>: recolectar únicamente la información estrictamente necesaria para la aplicación.</li>
<li data-marpit-fragment="2"><strong>Consentimiento e Información</strong>: explicar de forma clara cómo y para qué se usarán los datos.</li>
<li data-marpit-fragment="3"><strong>Seguridad</strong>: proteger la información sensible (contraseñas encriptadas, conexiones HTTPS, evitar filtrar datos en logs).</li>
<li data-marpit-fragment="4"><strong>Marco Regulatorio</strong>: cumplimiento de <a href="https://www.argentina.gob.ar/aaip/datospersonales">leyes de protección de datos.</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-marpit-fragments="4" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="%C3%A9tica-inform%C3%A1tica-buenas-pr%C3%A1cticas-en-el-desarrollo">Ética Informática: buenas prácticas en el desarrollo</h1>
<ul>
<li data-marpit-fragment="1"><strong>Código Limpio y Mantenible</strong>: pensar en el equipo y en quienes mantendrán el software a futuro.</li>
<li data-marpit-fragment="2"><strong>Transparencia y Honestidad</strong>: comunicar fallas de seguridad de forma responsable.</li>
<li data-marpit-fragment="3"><strong>Evitar <em>Dark Patterns</em></strong>: no diseñar interfaces engañosas que induzcan al usuario a realizar acciones no deseadas.</li>
<li data-marpit-fragment="4"><strong>Sostenibilidad y Accesibilidad</strong>: crear código eficiente que minimice el consumo de recursos e incluya a todos los usuarios.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="buenas-pr%C3%A1cticas---disposici%C3%B3n-n%C2%BA-1815">Buenas prácticas - (Disposición Nº 18/15)</h1>
<center><img src="images/Ethical_Design_x_Gemini_datos.png" alt="Roadmap Web Developer" width="990px" /></center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-fragments="3" data-theme="default" lang="es-AR" style="--theme:default;">
<h1 id="%C3%A9tica-inform%C3%A1tica-uso-de-la-ia">Ética Informática: uso de la IA</h1>
<p>Las herramientas de IA Generativa son un gran apoyo, pero requieren <strong>uso crítico y responsable</strong>:</p>
<ul>
<li data-marpit-fragment="1"><strong>Transparencia y Autoría</strong>: entender y validar el código generado antes de usarlo. No es ético entregar soluciones que no se comprenden.</li>
<li data-marpit-fragment="2"><strong>Sesgos Algorítmicos</strong>: la IA aprende de datos históricos que pueden reproducir o amplificar sesgos de género, raza o nivel socioeconómico.</li>
<li data-marpit-fragment="3"><strong>Derechos de Autor y Licencias</strong>: respetar las licencias del código utilizado para entrenar o generar modelos.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-theme="default" lang="es-AR" style="--theme:default;">
