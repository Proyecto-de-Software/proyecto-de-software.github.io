<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Conservar la historia de las cantidades</title><desc id="desc">Pedido, autorización y entrega representan momentos diferentes. No se debe sobrescribir toda la historia en un único campo cantidad.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="340" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="30" y="60" width="330" height="175" rx="18" fill="#dbeafe" stroke="#94a3b8"/><text x="195.0" y="100" text-anchor="middle" font-size="29" fill="#0f172a">Solicitud</text><text x="195.0" y="140" text-anchor="middle" font-size="23" fill="#0f172a">Cantidad pedida</text><text x="195.0" y="174" text-anchor="middle" font-size="23" fill="#0f172a">Qué se solicitó</text><path d="M365 145 L425 145" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="435" y="60" width="330" height="175" rx="18" fill="#ffedd5" stroke="#94a3b8"/><text x="600.0" y="100" text-anchor="middle" font-size="29" fill="#0f172a">Autorización</text><text x="600.0" y="140" text-anchor="middle" font-size="23" fill="#0f172a">Cantidad autorizada</text><text x="600.0" y="174" text-anchor="middle" font-size="23" fill="#0f172a">Qué se aprobó</text><path d="M770 145 L830 145" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="840" y="60" width="330" height="175" rx="18" fill="#dcfce7" stroke="#94a3b8"/><text x="1005.0" y="100" text-anchor="middle" font-size="29" fill="#0f172a">Entrega</text><text x="1005.0" y="140" text-anchor="middle" font-size="23" fill="#0f172a">Cantidad entregada</text><text x="1005.0" y="174" text-anchor="middle" font-size="23" fill="#0f172a">Qué se entregó</text><text x="600" y="295" text-anchor="middle" font-size="25" fill="#0f172a">Conservar qué ocurrió y quién intervino; no reemplazar el pasado.</text></g></svg>