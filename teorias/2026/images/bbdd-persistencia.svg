<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Del formulario a la persistencia</title><desc id="desc">Un POST llega a Flask, se valida y se guarda en PostgreSQL. Responder con éxito no demuestra por sí solo la persistencia.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="340" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="30" y="65" width="300" height="175" rx="18" fill="#dbeafe" stroke="#94a3b8"/><text x="180.0" y="105" text-anchor="middle" font-size="29" fill="#0f172a">Formulario</text><text x="180.0" y="145" text-anchor="middle" font-size="23" fill="#0f172a">POST /solicitudes</text><text x="180.0" y="179" text-anchor="middle" font-size="23" fill="#0f172a">cantidad: 20</text><path d="M335 150 L425 150" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="440" y="65" width="300" height="175" rx="18" fill="#ffedd5" stroke="#94a3b8"/><text x="590.0" y="105" text-anchor="middle" font-size="29" fill="#0f172a">Flask</text><text x="590.0" y="145" text-anchor="middle" font-size="23" fill="#0f172a">Interpretar y validar</text><text x="590.0" y="179" text-anchor="middle" font-size="23" fill="#0f172a">Ejecutar la operación</text><path d="M745 150 L835 150" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="850" y="65" width="320" height="175" rx="18" fill="#dcfce7" stroke="#94a3b8"/><text x="1010.0" y="105" text-anchor="middle" font-size="29" fill="#0f172a">PostgreSQL</text><text x="1010.0" y="145" text-anchor="middle" font-size="23" fill="#0f172a">Guardar la solicitud</text><text x="1010.0" y="179" text-anchor="middle" font-size="23" fill="#0f172a">Confirmar el cambio</text><text x="600" y="300" text-anchor="middle" font-size="25" fill="#0f172a">La respuesta debe reflejar el resultado de la operación.</text></g></svg>