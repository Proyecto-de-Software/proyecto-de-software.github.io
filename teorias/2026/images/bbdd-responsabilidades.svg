<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Separar HTTP, modelo y persistencia</title><desc id="desc">El controlador interpreta HTTP, el modelo ejecuta la operación y la base persiste los datos. Los resultados regresan al controlador para construir la respuesta.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="340" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="30" y="55" width="330" height="185" rx="18" fill="#dbeafe" stroke="#94a3b8"/><text x="195.0" y="95" text-anchor="middle" font-size="29" fill="#0f172a">Controlador</text><text x="195.0" y="135" text-anchor="middle" font-size="23" fill="#0f172a">Lee request.form</text><text x="195.0" y="169" text-anchor="middle" font-size="23" fill="#0f172a">Construye la respuesta</text><rect x="435" y="55" width="330" height="185" rx="18" fill="#ffedd5" stroke="#94a3b8"/><text x="600.0" y="95" text-anchor="middle" font-size="29" fill="#0f172a">Operación del modelo</text><text x="600.0" y="135" text-anchor="middle" font-size="23" fill="#0f172a">Aplica el caso de uso</text><text x="600.0" y="169" text-anchor="middle" font-size="23" fill="#0f172a">Coordina acceso a datos</text><rect x="840" y="55" width="330" height="185" rx="18" fill="#dcfce7" stroke="#94a3b8"/><text x="1005.0" y="95" text-anchor="middle" font-size="29" fill="#0f172a">SQL / PostgreSQL</text><text x="1005.0" y="135" text-anchor="middle" font-size="23" fill="#0f172a">Consulta y persiste</text><text x="1005.0" y="169" text-anchor="middle" font-size="23" fill="#0f172a">Protege restricciones</text><path d="M365 120 L425 120" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M770 120 L830 120" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M830 195 L770 195" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M425 195 L365 195" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="600" y="300" text-anchor="middle" font-size="25" fill="#0f172a">El acceso a datos no lee el formulario ni construye HTML.</text></g></svg>