<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">Una unidad de trabajo, dos desenlaces</title><desc id="desc">BEGIN agrupa registrar decisión y auditoría. Si todo sale bien COMMIT confirma ambos cambios; si falla la operación ROLLBACK deshace ambos.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="370" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="25" y="100" width="190" height="130" rx="18" fill="#dbeafe" stroke="#94a3b8"/><text x="120.0" y="140" text-anchor="middle" font-size="29" fill="#0f172a">BEGIN</text><text x="120.0" y="180" text-anchor="middle" font-size="23" fill="#0f172a">Iniciar</text><path d="M220 165 L280 165" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="290" y="75" width="410" height="190" rx="18" fill="#ffedd5" stroke="#94a3b8"/><text x="495.0" y="115" text-anchor="middle" font-size="29" fill="#0f172a">Unidad de trabajo</text><text x="495.0" y="155" text-anchor="middle" font-size="23" fill="#0f172a">1. Registrar decisión</text><text x="495.0" y="189" text-anchor="middle" font-size="23" fill="#0f172a">2. Registrar auditoría</text><path d="M705 140 L805 90" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M705 200 L805 275" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="820" y="20" width="350" height="130" rx="18" fill="#dcfce7" stroke="#94a3b8"/><text x="995.0" y="60" text-anchor="middle" font-size="29" fill="#0f172a">COMMIT</text><text x="995.0" y="100" text-anchor="middle" font-size="23" fill="#0f172a">Confirmar ambos cambios</text><rect x="820" y="210" width="350" height="130" rx="18" fill="#fee2e2" stroke="#94a3b8"/><text x="995.0" y="250" text-anchor="middle" font-size="29" fill="#0f172a">ROLLBACK</text><text x="995.0" y="290" text-anchor="middle" font-size="23" fill="#0f172a">Deshacer ambos cambios</text><text x="755" y="60" text-anchor="middle" font-size="21" fill="#0f172a">Éxito</text><text x="750" y="310" text-anchor="middle" font-size="21" fill="#0f172a">Fallo</text></g></svg>