<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Noto Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Pila de llamadas -->
  <rect x="20" y="20" width="300" height="300" rx="12" fill="#eef3fa" stroke="#246" stroke-width="2"/>
  <text x="170" y="56" text-anchor="middle" font-size="24" font-weight="bold" fill="#246">Pila de llamadas</text>
  <text x="170" y="82" text-anchor="middle" font-size="18" fill="#555">(call stack · un solo hilo)</text>
  <rect x="50" y="200" width="240" height="46" rx="6" fill="#f3d36b" stroke="#a88a1e"/>
  <text x="170" y="230" text-anchor="middle" font-size="20" font-family="monospace">fetch(url)</text>
  <rect x="50" y="252" width="240" height="46" rx="6" fill="#f3d36b" stroke="#a88a1e"/>
  <text x="170" y="282" text-anchor="middle" font-size="20" font-family="monospace">onClick()</text>

  <!-- APIs del navegador -->
  <rect x="460" y="20" width="360" height="200" rx="12" fill="#eaf6ee" stroke="#2a7a4a" stroke-width="2"/>
  <text x="640" y="56" text-anchor="middle" font-size="24" font-weight="bold" fill="#2a7a4a">APIs del navegador</text>
  <text x="640" y="82" text-anchor="middle" font-size="18" fill="#555">(trabajan en paralelo)</text>
  <rect x="490" y="105" width="300" height="40" rx="6" fill="#fff" stroke="#2a7a4a"/>
  <text x="640" y="132" text-anchor="middle" font-size="20">petición HTTP ⏳</text>
  <rect x="490" y="155" width="145" height="40" rx="6" fill="#fff" stroke="#2a7a4a"/>
  <text x="562" y="182" text-anchor="middle" font-size="18">setTimeout</text>
  <rect x="645" y="155" width="145" height="40" rx="6" fill="#fff" stroke="#2a7a4a"/>
  <text x="717" y="182" text-anchor="middle" font-size="18">eventos DOM</text>

  <!-- Cola de tareas -->
  <rect x="460" y="300" width="720" height="110" rx="12" fill="#f6eefa" stroke="#7a3f9a" stroke-width="2"/>
  <text x="490" y="336" font-size="24" font-weight="bold" fill="#7a3f9a">Cola de tareas</text>
  <text x="490" y="362" font-size="18" fill="#555">(callbacks listos)</text>
  <rect x="700" y="325" width="220" height="56" rx="6" fill="#fff" stroke="#7a3f9a"/>
  <text x="810" y="359" text-anchor="middle" font-size="18">callback del click</text>
  <rect x="935" y="325" width="225" height="56" rx="6" fill="#fff" stroke="#7a3f9a"/>
  <text x="1047" y="359" text-anchor="middle" font-size="18">callback del fetch</text>

  <!-- Flechas -->
  <!-- 1: pila -> APIs -->
  <path d="M320,120 L455,120" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="388" y="108" text-anchor="middle" font-size="18" font-weight="bold">1. inicia</text>
  <!-- 2: APIs -> cola -->
  <path d="M960,120 L1047,120 L1047,320" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M820,120 L960,120" stroke="#555" stroke-width="2.5" fill="none"/>
  <text x="1060" y="200" font-size="18" font-weight="bold">2. al terminar,</text>
  <text x="1060" y="224" font-size="18" font-weight="bold">encola el</text>
  <text x="1060" y="248" font-size="18" font-weight="bold">callback</text>
  <!-- 3: event loop cola -> pila -->
  <path d="M460,370 C380,370 330,370 290,330" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="160" y="368" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">3. event loop</text>
  <text x="160" y="394" text-anchor="middle" font-size="17" fill="#c0392b">si la pila está vacía,</text>
  <text x="160" y="416" text-anchor="middle" font-size="17" fill="#c0392b">pasa la próxima tarea</text>
</svg>
