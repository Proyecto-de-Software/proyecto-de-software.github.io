<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Mismo formato, distinto destinatario</title><desc id="desc">El ID token está dirigido a nuestra app, que lo lee para saber quién entró. El access token está dirigido a la API, que lo valida para decidir qué se puede hacer. Si el ID token llega a la API, ésta lo rechaza porque su aud no es la API.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b91c1c"/></marker></defs>
<rect width="1200" height="460" rx="26" fill="#f8fafc"/>
<g stroke-width="3">
<rect x="110" y="34" width="420" height="140" rx="10" fill="#fef3c7" stroke="#d97706"/>
<path d="M110 40 320 92 530 40" fill="none" stroke="#d97706"/>
<rect x="110" y="250" width="420" height="140" rx="10" fill="#fef3c7" stroke="#d97706"/>
<path d="M110 256 320 308 530 256" fill="none" stroke="#d97706"/>
