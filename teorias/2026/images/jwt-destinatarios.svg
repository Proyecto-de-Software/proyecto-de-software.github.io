<rect x="720" y="258" width="440" height="128" rx="18" fill="#fffbeb" stroke="#b45309"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="320" y="120" font-size="24" font-weight="bold" fill="#172554">ID token (JWT)</text>
<text x="320" y="148" font-size="21" fill="#334155">Para: <tspan font-weight="bold">nuestra app</tspan></text>
<text x="320" y="336" font-size="24" font-weight="bold" fill="#172554">Access token (JWT u opaco)</text>
<text x="320" y="364" font-size="21" fill="#334155">Para: <tspan font-weight="bold">la API</tspan></text>
<text x="940" y="96" font-size="26" font-weight="bold" fill="#166534">Nuestra app</text>
<text x="940" y="132" font-size="21" fill="#334155">lo lee: ¿quién entró?</text>
<text x="940" y="296" font-size="26" font-weight="bold" fill="#92400e">La API</text>
<text x="940" y="328" font-size="21" fill="#334155">lo valida: ¿qué se puede hacer?</text>
<text x="940" y="362" font-size="18" fill="#64748b">en el ejemplo, Google Calendar; con Vue, la nuestra</text>
</g>
<g font-family="Courier New,monospace" font-size="17" fill="#92400e" text-anchor="middle"><text x="320" y="166">aud = client_id</text><text x="320" y="382">aud = https://api…</text></g>
<g fill="none" stroke="#475569" stroke-width="4" marker-end="url(#a)"><path d="M530 104H714"/><path d="M530 320H714"/></g>
<path d="M530 150C620 180 640 240 714 282" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#r)"/>
<g font-family="Arial,sans-serif" fill="#b91c1c"><circle cx="622" cy="212" r="17" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="622" y="222" font-size="26" font-weight="bold" text-anchor="middle">✗</text><text x="660" y="206" font-size="18">la API lo rechaza:</text><text x="660" y="228" font-size="18"><tspan font-family="Courier New,monospace">aud</tspan> no es ella</text></g>
<text x="600" y="432" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#334155">Cada receptor mira <tspan font-family="Courier New,monospace">aud</tspan>: acepta sólo lo que está dirigido a él.</text>
</svg>
