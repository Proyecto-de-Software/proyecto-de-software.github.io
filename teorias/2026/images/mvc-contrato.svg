<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">El contrato entre modelo y template</title><desc id="desc">listar devuelve una colección de elementos con id, servicio y cantidad. render_template la entrega al template bajo el nombre solicitudes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="340" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="25" y="55" width="340" height="200" rx="18" fill="#dbeafe" stroke="#94a3b8"/><text x="195.0" y="95" text-anchor="middle" font-size="29" fill="#0f172a">Modelo · listar()</text><text x="195.0" y="135" text-anchor="middle" font-size="23" fill="#0f172a">Colección de elementos</text><text x="195.0" y="169" text-anchor="middle" font-size="23" fill="#0f172a">id · servicio · cantidad</text><path d="M370 150 L425 150" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="435" y="55" width="330" height="200" rx="18" fill="#ffedd5" stroke="#94a3b8"/><text x="600.0" y="95" text-anchor="middle" font-size="29" fill="#0f172a">Controlador</text><text x="600.0" y="135" text-anchor="middle" font-size="23" fill="#0f172a">render_template(...)</text><text x="600.0" y="169" text-anchor="middle" font-size="23" fill="#0f172a">solicitudes = colección</text><path d="M770 150 L830 150" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="840" y="55" width="335" height="200" rx="18" fill="#dcfce7" stroke="#94a3b8"/><text x="1007.5" y="95" text-anchor="middle" font-size="29" fill="#0f172a">Template</text><text x="1007.5" y="135" text-anchor="middle" font-size="23" fill="#0f172a">{% for s in solicitudes %}</text><text x="1007.5" y="169" text-anchor="middle" font-size="23" fill="#0f172a">{{ s.servicio }}</text><text x="600" y="305" text-anchor="middle" font-size="25" fill="#0f172a">Si cambian los nombres o la estructura, hay que adaptar el contrato.</text></g></svg>