<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Crear, configurar y registrar</title><desc id="desc">create_app crea una aplicación Flask, aplica la configuración y registra el Blueprint solicitudes. El Blueprint agrupa rutas y no es otra aplicación.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="340" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="30" y="55" width="320" height="195" rx="18" fill="#ffedd5" stroke="#94a3b8"/><text x="190.0" y="95" text-anchor="middle" font-size="29" fill="#0f172a">create_app()</text><text x="190.0" y="135" text-anchor="middle" font-size="23" fill="#0f172a">1. Crear Flask</text><text x="190.0" y="169" text-anchor="middle" font-size="23" fill="#0f172a">2. Aplicar configuración</text><path d="M355 150 L425 150" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="435" y="55" width="330" height="195" rx="18" fill="#dbeafe" stroke="#94a3b8"/><text x="600.0" y="95" text-anchor="middle" font-size="29" fill="#0f172a">Registrar Blueprint</text><text x="600.0" y="135" text-anchor="middle" font-size="23" fill="#0f172a">3. register_blueprint(bp)</text><text x="600.0" y="169" text-anchor="middle" font-size="23" fill="#0f172a">Rutas de solicitudes</text><path d="M770 150 L830 150" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="840" y="55" width="330" height="195" rx="18" fill="#dcfce7" stroke="#94a3b8"/><text x="1005.0" y="95" text-anchor="middle" font-size="29" fill="#0f172a">Aplicación lista</text><text x="1005.0" y="135" text-anchor="middle" font-size="23" fill="#0f172a">GET /solicitudes</text><text x="1005.0" y="169" text-anchor="middle" font-size="23" fill="#0f172a">POST /solicitudes</text><text x="600" y="305" text-anchor="middle" font-size="25" fill="#0f172a">El Blueprint agrupa operaciones; la factory devuelve la aplicación.</text></g></svg>