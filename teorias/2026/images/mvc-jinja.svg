<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Jinja se ejecuta en el servidor</title><desc id="desc">En el servidor Jinja combina datos y template para generar HTML. El navegador recibe el HTML resultante, no ejecuta el for de Jinja.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="340" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="20" y="20" width="760" height="295" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="400" y="57" text-anchor="middle" font-size="24" fill="#0f172a">SERVIDOR</text><rect x="40" y="85" width="305" height="185" rx="18" fill="#dbeafe" stroke="#94a3b8"/><text x="192.5" y="125" text-anchor="middle" font-size="29" fill="#0f172a">Datos + template</text><text x="192.5" y="165" text-anchor="middle" font-size="23" fill="#0f172a">Servicio A: 20</text><text x="192.5" y="199" text-anchor="middle" font-size="23" fill="#0f172a">{% for ... %}</text><path d="M350 175 L410 175" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="420" y="85" width="330" height="185" rx="18" fill="#dcfce7" stroke="#94a3b8"/><text x="585.0" y="125" text-anchor="middle" font-size="29" fill="#0f172a">Jinja → HTML</text><text x="585.0" y="165" text-anchor="middle" font-size="23" fill="#0f172a">&lt;li&gt;Servicio A:</text><text x="585.0" y="199" text-anchor="middle" font-size="23" fill="#0f172a">20 comidas&lt;/li&gt;</text><path d="M785 175 L845 175" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="815" y="143" text-anchor="middle" font-size="20" fill="#0f172a">HTTP</text><rect x="855" y="85" width="320" height="185" rx="18" fill="#ffedd5" stroke="#94a3b8"/><text x="1015.0" y="125" text-anchor="middle" font-size="29" fill="#0f172a">Navegador</text><text x="1015.0" y="165" text-anchor="middle" font-size="23" fill="#0f172a">Muestra la página</text><text x="1015.0" y="199" text-anchor="middle" font-size="23" fill="#0f172a">Recibe HTML</text></g></svg>