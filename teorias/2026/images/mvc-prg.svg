<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">POST, redirección y GET</title><desc id="desc">Tras crear y confirmar una solicitud el servidor responde 303 con Location. El navegador realiza GET al listado. Refrescar esa página repite el GET, no el POST.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="340" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="25" y="60" width="255" height="190" rx="18" fill="#dbeafe" stroke="#94a3b8"/><text x="152.5" y="100" text-anchor="middle" font-size="29" fill="#0f172a">1 · POST</text><text x="152.5" y="140" text-anchor="middle" font-size="23" fill="#0f172a">/solicitudes</text><text x="152.5" y="174" text-anchor="middle" font-size="23" fill="#0f172a">Enviar formulario</text><path d="M285 155 L325 155" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="335" y="60" width="255" height="190" rx="18" fill="#ffedd5" stroke="#94a3b8"/><text x="462.5" y="100" text-anchor="middle" font-size="29" fill="#0f172a">2 · Guardar</text><text x="462.5" y="140" text-anchor="middle" font-size="23" fill="#0f172a">Crear y confirmar</text><text x="462.5" y="174" text-anchor="middle" font-size="23" fill="#0f172a">Antes de redirigir</text><path d="M595 155 L635 155" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="645" y="60" width="235" height="190" rx="18" fill="#f3e8ff" stroke="#94a3b8"/><text x="762.5" y="100" text-anchor="middle" font-size="29" fill="#0f172a">3 · HTTP 303</text><text x="762.5" y="140" text-anchor="middle" font-size="23" fill="#0f172a">Location:</text><text x="762.5" y="174" text-anchor="middle" font-size="23" fill="#0f172a">/solicitudes</text><path d="M885 155 L925 155" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="935" y="60" width="240" height="190" rx="18" fill="#dcfce7" stroke="#94a3b8"/><text x="1055.0" y="100" text-anchor="middle" font-size="29" fill="#0f172a">4 · GET</text><text x="1055.0" y="140" text-anchor="middle" font-size="23" fill="#0f172a">/solicitudes</text><text x="1055.0" y="174" text-anchor="middle" font-size="23" fill="#0f172a">Mostrar listado</text><text x="600" y="305" text-anchor="middle" font-size="25" fill="#0f172a">Al refrescar la página final se repite el GET, no el POST.</text></g></svg>