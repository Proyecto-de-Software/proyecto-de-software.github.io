<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">MVC en el listado de solicitudes</title><desc id="desc">El controlador interpreta HTTP, pide datos al modelo y los pasa a la vista. El modelo conoce datos y reglas; el template presenta el resultado.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="380" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="30" y="65" width="330" height="190" rx="18" fill="#ffedd5" stroke="#94a3b8"/><text x="195.0" y="105" text-anchor="middle" font-size="29" fill="#0f172a">Controlador</text><text x="195.0" y="145" text-anchor="middle" font-size="23" fill="#0f172a">Interpreta HTTP</text><text x="195.0" y="179" text-anchor="middle" font-size="23" fill="#0f172a">Coordina la operación</text><rect x="435" y="65" width="330" height="190" rx="18" fill="#dbeafe" stroke="#94a3b8"/><text x="600.0" y="105" text-anchor="middle" font-size="29" fill="#0f172a">Modelo</text><text x="600.0" y="145" text-anchor="middle" font-size="23" fill="#0f172a">Datos y reglas</text><text x="600.0" y="179" text-anchor="middle" font-size="23" fill="#0f172a">No conoce el request</text><rect x="840" y="65" width="330" height="190" rx="18" fill="#dcfce7" stroke="#94a3b8"/><text x="1005.0" y="105" text-anchor="middle" font-size="29" fill="#0f172a">Vista · Jinja</text><text x="1005.0" y="145" text-anchor="middle" font-size="23" fill="#0f172a">Presenta los datos</text><text x="1005.0" y="179" text-anchor="middle" font-size="23" fill="#0f172a">No ejecuta SQL</text><path d="M365 130 L425 130" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M425 205 L365 205" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="398" y="110" text-anchor="middle" font-size="18" fill="#0f172a">pide</text><text x="398" y="235" text-anchor="middle" font-size="18" fill="#0f172a">datos</text><path d="M195 260 V305 H1005 V260" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="600" y="345" text-anchor="middle" font-size="25" fill="#0f172a">El controlador pasa los datos al template para generar HTML.</text></g></svg>