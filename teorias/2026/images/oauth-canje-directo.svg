<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Canje del código por el canal directo</title><desc id="desc">El servidor de la aplicación envía al token endpoint del proveedor el código, la redirect URI, el client_id, el verificador PKCE y, si aplica, su autenticación. El proveedor responde con el access token y, en OIDC, el ID token. El navegador no participa.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="430" rx="26" fill="#f8fafc"/>
<rect x="430" y="115" width="740" height="250" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 6"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="50" y="25" width="220" height="62" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
<rect x="450" y="25" width="260" height="62" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<rect x="880" y="25" width="270" height="62" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
<text x="160" y="64" font-size="25" fill="#94a3b8">Navegador</text>
<text x="580" y="64" font-size="25" fill="#172554">Servidor de la app</text>
<text x="1015" y="64" font-size="25" fill="#172554">Token endpoint</text>
<g font-size="24" fill="#94a3b8"><text x="160" y="215">No participa:</text><text x="160" y="247">el canje no aparece</text><text x="160" y="279">en DevTools</text></g>
<g font-size="22" fill="#172554" font-family="Courier New,monospace"><text x="797" y="150">code + redirect_uri</text><text x="797" y="177">+ client_id + code_verifier</text><text x="797" y="204">+ client_secret, si aplica</text><text x="797" y="300">access_token</text><text x="797" y="327">+ id_token (OIDC)</text></g>
<text x="800" y="398" font-size="23" fill="#1d4ed8">Canal directo servidor ↔ proveedor (por HTTPS)</text>
</g>
<g stroke-dasharray="6 8" stroke-width="2"><path d="M160 87V180M160 300V400" stroke="#cbd5e1"/><path d="M580 87V365" stroke="#94a3b8"/><path d="M1015 87V365" stroke="#94a3b8"/></g>
<g fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"><path d="M580 222H1009"/><path d="M1015 345H586"/></g>
</svg>
