<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Delegación sin compartir contraseña</title><desc id="desc">La persona se autentica ante el proveedor. El proveedor da un token limitado a la aplicación, que lo usa ante la API.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="500" rx="26" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="30" fill="#172554"><rect x="35" y="155" width="240" height="120" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="155" y="225">Persona</text><rect x="390" y="35" width="390" height="120" rx="20" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="585" y="105">Proveedor</text><rect x="390" y="340" width="390" height="120" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="585" y="410">Nuestra aplicación</text><rect x="915" y="340" width="250" height="120" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1040" y="410">API</text></g><g fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"><path d="M275 185 L390 112"/><path d="M585 155 L585 340"/><path d="M780 400 L915 400"/></g><g font-family="Arial,sans-serif" text-anchor="middle" font-size="24" fill="#334155"><text x="320" y="130">se autentica</text><text x="690" y="255">token limitado</text><text x="850" y="376">presenta token</text></g><path d="M280 245 L390 370" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="12 10"/><text x="290" y="317" font-family="Arial,sans-serif" font-size="22" fill="#b91c1c">no comparte clave</text></svg>
