<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Flujo Authorization Code</title><desc id="desc">Antes de empezar, la aplicación crea y guarda un verificador. Redirige el navegador al proveedor con la huella del verificador, recibe un código y lo canjea directamente presentando el verificador original. El access token se usa ante la API.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="660" rx="26" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="30" y="40" width="230" height="70" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="335" y="40" width="230" height="70" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><rect x="640" y="40" width="230" height="70" rx="15" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><rect x="945" y="40" width="230" height="70" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><g font-size="27" fill="#172554"><text x="145" y="85">Navegador</text><text x="450" y="85">App</text><text x="755" y="85">Proveedor</text><text x="1060" y="85">API</text></g></g><g stroke="#94a3b8" stroke-dasharray="9 9" stroke-width="2"><path d="M145 110v525"/><path d="M450 172v463M450 110v14"/><path d="M755 110v525"/><path d="M1060 110v525"/></g><rect x="295" y="124" width="310" height="48" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="155" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#166534">0. Crea y guarda el verificador</text><g fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"><path d="M145 225H745"/><path d="M755 310H155"/><path d="M145 395H440"/><path d="M450 490H745"/><path d="M755 550H460"/><path d="M450 615H1050"/></g><g font-family="Arial,sans-serif" font-size="22" fill="#1e293b"><text x="460" y="210" text-anchor="middle">1. Redirección: scope + state + desafío (huella)</text><text x="250" y="292">2. Login / consentimiento; vuelve código</text><text x="225" y="379">3. Callback: código + state</text><text x="470" y="475">4. Canje directo: código + verificador original</text><text x="520" y="535">5. Tokens</text><text x="610" y="599">6. Access token para acceder al recurso</text></g></svg>
