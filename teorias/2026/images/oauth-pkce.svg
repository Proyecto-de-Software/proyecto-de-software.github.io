<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">PKCE en tres momentos</title><desc id="desc">La aplicación guarda un verificador secreto, envía sólo su resumen al proveedor y presenta el verificador al canjear el código. El proveedor comprueba que coincide.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="500" rx="26" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><rect x="30" y="55" width="340" height="345" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="430" y="55" width="340" height="345" rx="20" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><rect x="830" y="55" width="340" height="345" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="200" y="110" font-size="28">1 · Crear</text><text x="600" y="110" font-size="28">2 · Pedir código</text><text x="1000" y="110" font-size="28">3 · Canjear</text><g font-size="25"><text x="200" y="175">La app inventa un</text><text x="200" y="208">valor al azar, nuevo</text><text x="200" y="241">en cada login</text><text x="200" y="300">= verificador</text><text x="600" y="185">Envía sólo una</text><text x="600" y="220">huella del verificador</text><text x="600" y="285">desafío = S256(...)</text><text x="1000" y="185">Presenta el código</text><text x="1000" y="220">y el verificador</text><text x="1000" y="285">El proveedor compara</text></g></g><g fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"><path d="M370 225H425"/><path d="M770 225H825"/></g><text x="600" y="455" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" fill="#334155">La huella viaja al inicio; el valor original, sólo durante el canje.</text></svg>
