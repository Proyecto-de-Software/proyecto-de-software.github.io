<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="425" viewBox="0 0 1200 425" role="img" aria-labelledby="title desc"><title id="title">Herramientas y responsabilidades</title><desc id="desc">Flask se integra con SQLAlchemy mediante Flask-SQLAlchemy. El ORM usa psycopg2 para acceder a PostgreSQL.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="425" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="35" y="20" width="370" height="60" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="220.0" y="58" text-anchor="middle" font-size="26" fill="#0f172a">Flask</text><text x="790" y="58" text-anchor="middle" font-size="25" fill="#0f172a">Request y response</text><path d="M220 82 L220 96" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="35" y="98" width="370" height="60" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="220.0" y="136" text-anchor="middle" font-size="26" fill="#0f172a">Flask-SQLAlchemy</text><text x="790" y="136" text-anchor="middle" font-size="25" fill="#0f172a">Integración con la aplicación</text><path d="M220 160 L220 174" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="35" y="176" width="370" height="60" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="220.0" y="214" text-anchor="middle" font-size="26" fill="#0f172a">SQLAlchemy ORM</text><text x="790" y="214" text-anchor="middle" font-size="25" fill="#0f172a">Objetos, consultas y unidad de trabajo</text><path d="M220 238 L220 252" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="35" y="254" width="370" height="60" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="220.0" y="292" text-anchor="middle" font-size="26" fill="#0f172a">psycopg2</text><text x="790" y="292" text-anchor="middle" font-size="25" fill="#0f172a">Comunicación con PostgreSQL</text><path d="M220 316 L220 330" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="35" y="332" width="370" height="60" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="220.0" y="370" text-anchor="middle" font-size="26" fill="#0f172a">PostgreSQL</text><text x="790" y="370" text-anchor="middle" font-size="25" fill="#0f172a">Ejecución, restricciones y persistencia</text></g></svg>