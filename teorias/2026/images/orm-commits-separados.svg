<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="225" viewBox="0 0 1200 225" role="img" aria-labelledby="title desc"><title id="title">El riesgo de confirmar por separado</title><desc id="desc">A se confirma antes de intentar B. Si B falla, A permanece confirmado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="225" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="30" y="25" width="330" height="105" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="195.0" y="63" text-anchor="middle" font-size="27" fill="#0f172a">Cambiar A</text><text x="195.0" y="99" text-anchor="middle" font-size="22" fill="#0f172a">Primera operación</text><rect x="435" y="25" width="330" height="105" rx="16" fill="#dcfce7" stroke="#94a3b8"/><text x="600.0" y="63" text-anchor="middle" font-size="27" fill="#0f172a">COMMIT</text><text x="600.0" y="99" text-anchor="middle" font-size="22" fill="#0f172a">A confirmado</text><rect x="840" y="25" width="330" height="105" rx="16" fill="#fee2e2" stroke="#94a3b8"/><text x="1005.0" y="63" text-anchor="middle" font-size="27" fill="#0f172a">Cambiar B</text><text x="1005.0" y="99" text-anchor="middle" font-size="22" fill="#0f172a">Falla la operación</text><path d="M365 78 L430 78" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M770 78 L835 78" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="600" y="185" text-anchor="middle" font-size="28" fill="#9a3412">Un rollback posterior no deshace el commit de A.</text></g></svg>