<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" role="img" aria-labelledby="title desc"><title id="title">Crear tablas no es migrar</title><desc id="desc">Las clases producen metadatos; create_all crea las tablas faltantes, pero no modifica las existentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="245" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="30" y="35" width="340" height="110" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="200.0" y="73" text-anchor="middle" font-size="27" fill="#0f172a">Clases Python</text><text x="200.0" y="109" text-anchor="middle" font-size="22" fill="#0f172a">Declaran el mapeo</text><path d="M375 90 L425 90" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="35" width="340" height="110" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="600.0" y="73" text-anchor="middle" font-size="27" fill="#0f172a">Metadatos</text><text x="600.0" y="109" text-anchor="middle" font-size="22" fill="#0f172a">Describen el esquema</text><path d="M775 90 L825 90" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="830" y="35" width="340" height="110" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="1000.0" y="73" text-anchor="middle" font-size="27" fill="#0f172a">create_all()</text><text x="1000.0" y="109" text-anchor="middle" font-size="22" fill="#0f172a">Crea tablas faltantes</text><text x="600" y="205" text-anchor="middle" font-size="26" fill="#0f172a">Las tablas existentes no se modifican: necesitan migraciones.</text></g></svg>