<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc"><title id="title">Del request a la persistencia</title><desc id="desc">La petición avanza del cliente al controlador, al modelo y a la persistencia. Los resultados regresan en sentido inverso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="280" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="30.0" y="65" width="247.5" height="120" rx="16" fill="#ffedd5" stroke="#94a3b8"/><text x="153.75" y="103" text-anchor="middle" font-size="24" fill="#0f172a">Cliente</text><text x="153.75" y="139" text-anchor="middle" font-size="22" fill="#0f172a">HTTP</text><path d="M282.5 100 L322.5 100" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M322.5 155 L282.5 155" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="327.5" y="65" width="247.5" height="120" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="451.25" y="103" text-anchor="middle" font-size="24" fill="#0f172a">Controlador</text><text x="451.25" y="139" text-anchor="middle" font-size="22" fill="#0f172a">Interpreta entradas</text><path d="M580.0 100 L620.0 100" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M620.0 155 L580.0 155" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="625.0" y="65" width="247.5" height="120" rx="16" fill="#dcfce7" stroke="#94a3b8"/><text x="748.75" y="103" text-anchor="middle" font-size="24" fill="#0f172a">Modelo</text><text x="748.75" y="139" text-anchor="middle" font-size="22" fill="#0f172a">Reglas y operación</text><path d="M877.5 100 L917.5 100" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M917.5 155 L877.5 155" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="922.5" y="65" width="247.5" height="120" rx="16" fill="#e0e7ff" stroke="#94a3b8"/><text x="1046.25" y="103" text-anchor="middle" font-size="24" fill="#0f172a">Persistencia</text><text x="1046.25" y="139" text-anchor="middle" font-size="22" fill="#0f172a">Acceso a la base</text><text x="600" y="35" text-anchor="middle" font-size="22" fill="#1d4ed8">Solicitud y operaciones →</text><text x="600" y="240" text-anchor="middle" font-size="22" fill="#1d4ed8">← Resultados y respuesta</text></g></svg>