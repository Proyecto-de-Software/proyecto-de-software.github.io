<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="255" viewBox="0 0 1200 255" role="img" aria-labelledby="title desc"><title id="title">Controlador y operación del modelo</title><desc id="desc">El controlador envía datos interpretados al modelo. El modelo aplica reglas y coordina la transacción, y devuelve resultado o error.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="255" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="30" y="30" width="430" height="195" rx="16" fill="#ffedd5" stroke="#94a3b8"/><text x="245.0" y="68" text-anchor="middle" font-size="27" fill="#0f172a">Controlador</text><text x="245.0" y="104" text-anchor="middle" font-size="22" fill="#0f172a">Interpreta el formulario</text><text x="245.0" y="134" text-anchor="middle" font-size="22" fill="#0f172a">Traduce el resultado</text><text x="245.0" y="164" text-anchor="middle" font-size="22" fill="#0f172a">Elige HTML o redirección</text><rect x="740" y="30" width="430" height="195" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="955.0" y="68" text-anchor="middle" font-size="27" fill="#0f172a">Operación del modelo</text><text x="955.0" y="104" text-anchor="middle" font-size="22" fill="#0f172a">Valida las reglas</text><text x="955.0" y="134" text-anchor="middle" font-size="22" fill="#0f172a">Coordina la persistencia</text><text x="955.0" y="164" text-anchor="middle" font-size="22" fill="#0f172a">Confirma o revierte</text><path d="M475 85 L725 85" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="600" y="65" text-anchor="middle" font-size="21" fill="#0f172a">Datos interpretados</text><path d="M725 175 L475 175" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="600" y="155" text-anchor="middle" font-size="21" fill="#0f172a">Resultado o error</text></g></svg>