<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc"><title id="title">Dos escrituras, una transacción</title><desc id="desc">Se insertan servicio y solicitud, y se confirman juntos. Un fallo requiere revertir la transacción.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="230" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="30" y="30" width="340" height="105" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="200.0" y="68" text-anchor="middle" font-size="27" fill="#0f172a">INSERT servicio</text><text x="200.0" y="104" text-anchor="middle" font-size="22" fill="#0f172a">Primera escritura</text><path d="M375 80 L425 80" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="30" width="340" height="105" rx="16" fill="#dbeafe" stroke="#94a3b8"/><text x="600.0" y="68" text-anchor="middle" font-size="27" fill="#0f172a">INSERT solicitud</text><text x="600.0" y="104" text-anchor="middle" font-size="22" fill="#0f172a">Segunda escritura</text><path d="M775 80 L825 80" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="830" y="30" width="340" height="105" rx="16" fill="#dcfce7" stroke="#94a3b8"/><text x="1000.0" y="68" text-anchor="middle" font-size="27" fill="#0f172a">COMMIT</text><text x="1000.0" y="104" text-anchor="middle" font-size="22" fill="#0f172a">Confirma ambas</text><text x="600" y="190" text-anchor="middle" font-size="27" fill="#9a3412">Si falla una escritura: ROLLBACK de la transacción</text></g></svg>