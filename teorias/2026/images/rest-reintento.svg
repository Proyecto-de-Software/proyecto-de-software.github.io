<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc"><title id="title">La respuesta puede perderse después de confirmar</title><desc id="desc">POST crea la solicitud; commit ocurre; la respuesta se pierde y el cliente no conoce el resultado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="290" rx="24" fill="#f8fafc"/><rect x="25" y="65" width="225" height="105" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/><text x="137.5" y="111.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Cliente</text><text x="137.5" y="142.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">envía POST</text><rect x="365" y="65" width="215" height="105" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/><text x="472.5" y="111.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">API</text><text x="472.5" y="142.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">crea solicitud</text><rect x="700" y="65" width="210" height="105" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/><text x="805.0" y="111.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Base</text><text x="805.0" y="142.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">COMMIT</text><rect x="995" y="65" width="180" height="105" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/><text x="1085.0" y="111.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Respuesta</text><text x="1085.0" y="142.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">perdida</text><path d="M250 115 L365 115" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M580 115 L700 115" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M910 115 L995 115" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#334155">Repetir POST sin deduplicación puede crear otra solicitud.</text></svg>
