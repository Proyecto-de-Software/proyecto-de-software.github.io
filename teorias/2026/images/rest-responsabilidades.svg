<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc"><title id="title">Contrato, reglas e integridad</title><desc id="desc">Schema verifica campos; modelo comprueba reglas y coordina la transacción; base preserva restricciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="290" rx="24" fill="#f8fafc"/><rect x="30" y="55" width="310" height="145" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/><text x="185.0" y="121.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Schema</text><text x="185.0" y="152.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">tipos y campos</text><rect x="445" y="55" width="310" height="145" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/><text x="600.0" y="121.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Modelo</text><text x="600.0" y="152.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">reglas y transacción</text><rect x="860" y="55" width="310" height="145" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/><text x="1015.0" y="121.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Base de datos</text><text x="1015.0" y="152.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">FK · CHECK · NOT NULL</text><path d="M340 125 L445 125" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M755 125 L860 125" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#334155">El acceso autorizado se comprueba en el servidor, no en el JSON.</text></svg>
