<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Cada request lleva contexto</title><desc id="desc">Dos peticiones aportan contexto; los datos del recurso permanecen en PostgreSQL.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs><rect width="1200" height="300" rx="24" fill="#f8fafc"/><rect x="30" y="40" width="310" height="80" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/><text x="185.0" y="89.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Petición 1 + contexto</text><rect x="30" y="170" width="310" height="80" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/><text x="185.0" y="219.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Petición 2 + contexto</text><rect x="500" y="95" width="245" height="110" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/><text x="622.5" y="159.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">API</text><rect x="940" y="95" width="220" height="110" rx="14" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/><text x="1050.0" y="143.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Estado de</text><text x="1050.0" y="174.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">los recursos</text><path d="M340 80 L500 125" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M340 210 L500 175" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 150 L940 150" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="842.5" y="138.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">persistencia</text></svg>
