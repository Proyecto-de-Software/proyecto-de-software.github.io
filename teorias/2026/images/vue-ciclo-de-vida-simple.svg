<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de vida simplificado de una app Vue</title>
  <desc id="desc">Al montar la app se ejecuta created, con los datos reactivos y sin DOM; luego mounted, con la app en el DOM; cada vez que cambian los datos se ejecuta updated; al quitar la app se ejecuta unmounted.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity=".14"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#059669"/></marker>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#f8fafc"/>

  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#s)">
    <rect x="30" y="150" width="190" height="110" rx="22" fill="#fff" stroke="#60a5fa" stroke-width="3"/>
    <text x="125" y="198" font-family="monospace" font-size="19" font-weight="700" fill="#1e3a8a">createApp()</text>
    <text x="125" y="228" font-family="monospace" font-size="19" font-weight="700" fill="#1e3a8a">.mount()</text>

    <rect x="270" y="150" width="200" height="110" rx="22" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
    <text x="370" y="205" font-family="monospace" font-size="28" font-weight="700" fill="#5b21b6">created</text>

    <rect x="520" y="150" width="200" height="110" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="620" y="205" font-family="monospace" font-size="28" font-weight="700" fill="#065f46">mounted</text>

    <rect x="770" y="150" width="200" height="110" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text x="870" y="205" font-family="monospace" font-size="28" font-weight="700" fill="#9a3412">updated</text>

    <rect x="1010" y="150" width="170" height="110" rx="22" fill="#fef2f2" stroke="#f87171" stroke-width="3"/>
    <text x="1095" y="205" font-family="monospace" font-size="26" font-weight="700" fill="#991b1b">unmounted</text>
  </g>

  <g fill="none" stroke-width="6">
    <path d="M220 205H250" stroke="#2563eb" marker-end="url(#a)"/>
    <path d="M470 205H500" stroke="#2563eb" marker-end="url(#a)"/>
    <path d="M720 205H750" stroke="#2563eb" marker-end="url(#a)"/>
    <path d="M970 205H990" stroke="#2563eb" marker-end="url(#a)"/>
    <path d="M830 150V95H910V140" stroke="#059669" stroke-linejoin="round" marker-end="url(#v)"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="770" y="45" width="200" height="40" rx="20" fill="#d1fae5"/>
    <text x="870" y="72" font-size="19" font-weight="700" fill="#047857">cambian los datos</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="19" fill="#334155" text-anchor="middle">
    <text x="370" y="300">datos reactivos,</text>
    <text x="370" y="326">todavía sin DOM</text>
    <text x="370" y="352" font-weight="700" fill="#5b21b6">pedir datos a la API</text>

    <text x="620" y="300">la app ya está</text>
    <text x="620" y="326">en el DOM</text>

    <text x="870" y="300">re-render y patch</text>
    <text x="870" y="326">(Virtual DOM)</text>

    <text x="1095" y="300">se quitó del DOM:</text>
    <text x="1095" y="326">limpiar timers</text>
  </g>
</svg>
